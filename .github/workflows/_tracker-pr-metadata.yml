# Copies the labels, assignees, and shared milestone of the issues a pull
# request references to the pull request. Callers start from
# templates/workflows/tracker-pr-metadata.yml in @agenticool/tracker, on
# pull_request_target. The steps run the agenticool-tracker that the caller's
# default-branch package-lock.json installs, never pull request code, so the
# caller's default branch must list @agenticool/tracker in package.json.

name: 'Tracker: copy issue metadata to PR (reusable)'

on:
  workflow_call:
    inputs:
      token_env:
        description: Secret holding the Projects token, the same name as binding.tokenEnv
        type: string
        required: true
      pull_request:
        description: Pull request number
        type: number
        required: true
      dry_run:
        description: Preview without writes
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  copy-issue-metadata:
    name: Copy linked issue labels, assignees, and milestone to PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always execute trusted default-branch code, including for fork PRs.
      - name: Check out the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
      - name: Install dependencies
        run: npm ci
      - name: Copy labels, assignees, and milestone
        env:
          TOKEN_ENV: ${{ inputs.token_env }}
          PROJECT_TOKEN: ${{ secrets[inputs.token_env] }}
          PR_NUMBER: ${{ inputs.pull_request }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          export "$TOKEN_ENV=$PROJECT_TOKEN"
          npx --no agenticool-tracker pr-metadata
