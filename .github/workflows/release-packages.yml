name: 'Release: packages'

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Release Please runs only with the GitHub App token: this organization does
# not let GITHUB_TOKEN create pull requests, and pull requests opened with it
# would not start checks. Until RELEASE_PLEASE_APP_ID is set, the job warns
# and skips releases. The app token carries the app's own permissions.
permissions:
  contents: read

jobs:
  update-release-pr:
    name: Update release PR and create releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - name: Check for the release app
        id: release-app
        env:
          APP_ID: ${{ vars.RELEASE_PLEASE_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "::warning::RELEASE_PLEASE_APP_ID is not set; skipping releases"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release token
        id: app-token
        if: steps.release-app.outputs.configured == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Run Release Please
        id: release
        if: steps.release-app.outputs.configured == 'true'
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-packages:
    name: Publish released packages to npm
    needs: update-release-pr
    # Publishing stays off until npm credentials exist: set the
    # NPM_PUBLISH_ENABLED variable to true once they do.
    if: needs.update-release-pr.outputs.releases_created == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token lets npm publish through trusted publishing and sign provenance.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      # NPM_TOKEN is needed only for a package's first publish: npm accepts a
      # trusted publisher only for a package that already exists. Once every
      # package has one, the secret can be deleted and npm uses OIDC alone.
      - name: Publish each released package
        env:
          PATHS_RELEASED: ${{ needs.update-release-pr.outputs.paths_released }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for path in $(node -e 'for (const p of JSON.parse(process.env.PATHS_RELEASED)) console.log(p)'); do
            npm publish --workspace "$path" --provenance --access public
          done
