# Adds one issue to the project and triages it, or adds every open issue
# missing from the project when `issue` is 0. Callers start from
# templates/workflows/tracker-project-membership.yml in @agenticool/tracker.
# The steps install only @agenticool/tracker at the caller's tracker_version,
# outside the checkout, and run it against the caller's default-branch
# .agents/policy.json.

name: 'Tracker: add issues to the project (reusable)'

on:
  workflow_call:
    inputs:
      token_env:
        description: Environment variable the CLI reads the Projects token from, the same name as binding.tokenEnv
        type: string
        required: true
      tracker_version:
        description: Version of @agenticool/tracker to install; `workspace` installs the checkout's workspace packages instead
        type: string
        required: true
      issue:
        description: Issue to add and triage; 0 adds every open issue missing from the project
        type: number
        default: 0
      dry_run:
        description: Preview without writes
        type: boolean
        default: false
    secrets:
      project_token:
        description: Projects token, from the secret named by binding.tokenEnv
        required: false

permissions:
  contents: read

jobs:
  add-to-project:
    name: Add the issue to the project
    if: inputs.issue != 0
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      TOKEN_ENV: ${{ inputs.token_env }}
    steps:
      # Without the secret the job succeeds with a warning, so a repository
      # can install the workflows before its project and token exist. A set
      # but invalid token still fails in the command steps.
      - name: Check the project token
        id: token
        env:
          PROJECT_TOKEN: ${{ secrets.project_token }}
        run: |
          if [ -n "$PROJECT_TOKEN" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$TOKEN_ENV secret is not set; skipping"
          fi
      # Execute trusted default-branch code.
      - name: Check out the default branch
        if: steps.token.outputs.set == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          # Cone mode keeps root files such as .tool-versions. The workspace
          # install also needs the packages.
          sparse-checkout: |
            .agents
            ${{ inputs.tracker_version == 'workspace' && 'packages' || '' }}
      - name: Set up Node.js
        if: steps.token.outputs.set == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
      - name: Install the tracker
        if: steps.token.outputs.set == 'true'
        env:
          TRACKER_VERSION: ${{ inputs.tracker_version }}
        run: |
          if [ "$TRACKER_VERSION" = workspace ]; then
            npm ci
            echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          else
            npm install --prefix "$RUNNER_TEMP/agenticool" --no-save --no-audit --no-fund "@agenticool/tracker@$TRACKER_VERSION"
            echo "$RUNNER_TEMP/agenticool/node_modules/.bin" >> "$GITHUB_PATH"
          fi
      - name: Add the issue to the project
        if: steps.token.outputs.set == 'true'
        env:
          PROJECT_TOKEN: ${{ secrets.project_token }}
          CONTENT_TYPE: 'issue'
          CONTENT_NUMBER: ${{ inputs.issue }}
        run: |
          export "$TOKEN_ENV=$PROJECT_TOKEN"
          agenticool-tracker membership
      # The item exists now, so this is the issue's first triage run.
      - name: Triage the new issue
        if: steps.token.outputs.set == 'true'
        env:
          PROJECT_TOKEN: ${{ secrets.project_token }}
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: |
          export "$TOKEN_ENV=$PROJECT_TOKEN"
          agenticool-tracker triage --issue "$ISSUE_NUMBER"

  add-missing-issues:
    name: Add missing open issues to the project
    if: inputs.issue == 0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      TOKEN_ENV: ${{ inputs.token_env }}
    steps:
      # Without the secret the job succeeds with a warning, so a repository
      # can install the workflows before its project and token exist. A set
      # but invalid token still fails in the command steps.
      - name: Check the project token
        id: token
        env:
          PROJECT_TOKEN: ${{ secrets.project_token }}
        run: |
          if [ -n "$PROJECT_TOKEN" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$TOKEN_ENV secret is not set; skipping"
          fi
      # Execute trusted default-branch code.
      - name: Check out the default branch
        if: steps.token.outputs.set == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          # Cone mode keeps root files such as .tool-versions. The workspace
          # install also needs the packages.
          sparse-checkout: |
            .agents
            ${{ inputs.tracker_version == 'workspace' && 'packages' || '' }}
      - name: Set up Node.js
        if: steps.token.outputs.set == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
      - name: Install the tracker
        if: steps.token.outputs.set == 'true'
        env:
          TRACKER_VERSION: ${{ inputs.tracker_version }}
        run: |
          if [ "$TRACKER_VERSION" = workspace ]; then
            npm ci
            echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          else
            npm install --prefix "$RUNNER_TEMP/agenticool" --no-save --no-audit --no-fund "@agenticool/tracker@$TRACKER_VERSION"
            echo "$RUNNER_TEMP/agenticool/node_modules/.bin" >> "$GITHUB_PATH"
          fi
      - name: Add missing open issues to the project
        if: steps.token.outputs.set == 'true'
        env:
          PROJECT_TOKEN: ${{ secrets.project_token }}
          SWEEP: 'true'
        run: |
          export "$TOKEN_ENV=$PROJECT_TOKEN"
          agenticool-tracker membership
