name: 'Tracker: add issues to the project'
run-name: "${{ github.event_name == 'issues' && format('Add issue #{0} to {{project.name}}', github.event.issue.number) || format('Add missing issues to {{project.name}} ({0})', github.event_name) }}"

on:
  issues:
    types: [opened]
  # GitHub sometimes creates no run for an `opened` event, which never fires
  # again for that issue, so the hourly tracker-issue-states.yml sweep adds
  # every open issue still missing before it triages. A manual run here sweeps
  # project membership alone.
  workflow_dispatch:
    inputs:
      dry_run:
        description: List open issues missing from {{project.name}} without adding them
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: "${{ github.event_name == 'issues' && format('project-membership-issue-{0}', github.event.issue.number) || 'project-membership-sweep' }}"
  cancel-in-progress: false

jobs:
  add-to-project:
    name: Add the new issue to {{project.name}}
    if: github.event_name == 'issues' && github.repository == '{{repository}}'
    uses: agenticool/agenticool/.github/workflows/_tracker-project-membership.yml@tracker-v{{version}}
    with:
      token_env: '{{tokenEnv}}'
      issue: ${{ github.event.issue.number }}
    secrets:
      project_token: ${{ secrets.{{tokenEnv}} }}

  add-missing-issues:
    name: Add missing open issues to {{project.name}}
    if: github.event_name != 'issues' && github.repository == '{{repository}}' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: agenticool/agenticool/.github/workflows/_tracker-project-membership.yml@tracker-v{{version}}
    with:
      token_env: '{{tokenEnv}}'
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets:
      project_token: ${{ secrets.{{tokenEnv}} }}
